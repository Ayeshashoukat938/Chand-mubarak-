
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zil Hajj Mubarak 🌙</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
font-family:'Poppins',sans-serif;
background:linear-gradient(135deg,#050816,#101935,#1f4068);
overflow:hidden;
color:white;
text-align:center;
}

.stars{
position:absolute;
width:100%;
height:100%;
background:url('https://i.imgur.com/YKY28eT.png');
animation:move 80s linear infinite;
opacity:0.4;
}

@keyframes move{
from{background-position:0 0;}
to{background-position:1000px 1000px;}
}

.card{
position:relative;
padding:45px;
width:90%;
max-width:500px;
background:rgba(255,255,255,0.08);
border:1px solid rgba(255,255,255,0.2);
backdrop-filter:blur(12px);
border-radius:30px;
box-shadow:0 0 30px rgba(255,215,0,0.15);
z-index:1;
animation:fade 2s ease;
}

@keyframes fade{
from{
opacity:0;
transform:translateY(30px);
}
to{
opacity:1;
transform:translateY(0);
}
}

.moon{
font-size:70px;
margin-bottom:15px;
animation:glow 2s infinite alternate;
}

@keyframes glow{
from{filter:drop-shadow(0 0 5px gold);}
to{filter:drop-shadow(0 0 20px gold);}
}

h1{
font-size:42px;
color:#ffd369;
margin-bottom:15px;
}

p{
font-size:18px;
line-height:1.8;
color:#f1f1f1;
margin-bottom:25px;
}

.btn{
display:inline-block;
padding:14px 28px;
background:linear-gradient(45deg,#ffd369,#ffb703);
color:#111;
text-decoration:none;
font-weight:bold;
border-radius:40px;
transition:0.3s;
}

.btn:hover{
transform:scale(1.08);
box-shadow:0 0 20px gold;
}

.small{
margin-top:25px;
font-size:14px;
opacity:0.7;
}
</style>
</head>

<body>

<div class="stars"></div>

<div class="card">

<div class="moon">🌙</div>

<h1>Zil Hajj Mubarak</h1>

<p>
May ALLAH make this Month Full Of sabar, Khushiyan, peace, Khyr and Kamyabian for You. AMmmEeNnnnn❤️✨
From: Ayesha Shoukat 😊✨
</p>

<a class="btn" href="https://wa.me/?text=🌙%20Zil%20Hajj%20Mubarak%20✨">
Send Mubarak
</a>

<div class="small">
Made with 🤍
</div>

</div>

</body>
</html>
